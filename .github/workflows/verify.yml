name: Verify role execution
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      application_server:
        type: boolean
        description: Also download verified WildFly and exercise actual WAR lifecycle
        default: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Review artefact consistency
        run: python3 tests/audit_repository.py
      - name: Build actual WAR and domain tests
        run: mvn -B -ntp verify
      - name: Start isolated synthetic local lab
        run: python3 src/scripts/manage.py start
      - name: HTTP acceptance
        run: python3 -m unittest discover -s tests/acceptance -v
      - name: Migration, restore and cutover gates
        run: python3 -m unittest discover -s tests -p test_maintenance.py -v
      - name: Operational automation
        run: python3 tests/check_scripts.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser task and mobile acceptance
        run: npm run test:ui
      - name: Install verified actual application server
        if: github.event_name == 'workflow_dispatch' && inputs.application_server
        run: python3 deployment/scripts/wildfly_lab.py install
      - name: Deploy real WAR
        if: github.event_name == 'workflow_dispatch' && inputs.application_server
        run: python3 deployment/scripts/wildfly_lab.py start
      - name: Same HTTP contract on WildFly
        if: github.event_name == 'workflow_dispatch' && inputs.application_server
        run: python3 deployment/scripts/wildfly_lab.py test
      - name: Actual undeploy / redeploy
        if: github.event_name == 'workflow_dispatch' && inputs.application_server
        run: python3 deployment/scripts/wildfly_lab.py redeploy
      - name: Stop owned lab processes
        if: always()
        run: python3 src/scripts/cleanup_ci.py
      - name: Preserve non-secret test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: role-execution-verification
          path: |
            target/surefire-reports/*.xml
            runtime/release-manifest.json
            runtime/portal-desktop.png
            runtime/portal-mobile.png
          retention-days: 7
